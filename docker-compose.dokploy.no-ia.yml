# ============================================================================
# docker-compose.dokploy.no-ia.yml — version SANS IA
# Aucune sandbox n8n, aucun service IA : pas de sandbox-certs/api/runner,
# pas de SearXNG (web search de l'Assistant), pas de variables N8N_INSTANCE_AI_*.
# Le module Assistant (instance-ai) est déchargé par défaut via
# N8N_DISABLED_MODULES (surcharge possible par env).
#
# Différences avec docker-compose.yml :
#   - Pas de ports exposés (Dokploy/Traefik gère le routing)
#   - Pas de env_file: .env (Dokploy écrit .env depuis l'UI, les ${...} suffisent)
#   - restart: unless-stopped sur les services persistants
#   - Réseau dokploy-network (Isolated Deployments le gère automatiquement)
#   - Labels Traefik en commentaires (préférer l'onglet Domains de l'UI)
#
# Env example : docker-compose.dokploy.no-ia.env.example
# Version AVEC IA : docker-compose.dokploy.yml
# ============================================================================

services:
  # --- Task Runners : exécution isolée du code JS/Python ---
  task-runners:
    image: n8nio/runners:latest
    restart: unless-stopped
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      N8N_RUNNERS_AUTH_TOKEN: n8n-runners-auth-token-a3f8b2c1d4e5f6a7b8c9d0e1f2a3b4c5
    depends_on:
      - n8n

  # --- PostgreSQL 17 Alpine ---
  # ⚠️ POSTGRES_PASSWORD initialisé une seule fois au 1er démarrage.
  # Si tu changes DB_POSTGRESDB_PASSWORD dans l'UI Dokploy, il faut aussi
  # supprimer le volume db-storage pour que postgres se réinitialise.
  # ⚠️ Le password est en dur pour éviter les erreurs de config Dokploy.
  # Pour le changer : modifie ces 2 lignes ET supprime le volume db-storage.
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: a3f8b2c1d4e5f6a7b8c9d0e1f2a3b4c5
      POSTGRES_DB: n8n
      PGDATA: /var/lib/postgresql/data
    volumes:
      - db-storage:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U n8n -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- n8n : workflow editor (sans IA) ---
  n8n:
    image: n8nio/n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Pas de ports: Dokploy/Traefik gère le routing via l'onglet Domains
    volumes:
      # Persiste ~/.n8n (clé d'encryption instance + binary data).
      # Sans ce volume, recréer le conteneur (redeploy, update d'image)
      # génère une nouvelle clé → n8n crash-loop sur les données chiffrées en DB.
      - n8n-storage:/home/node/.n8n
    environment:
      # --- Task Runners (external mode — isolation du code) ---
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_RUNNERS_AUTH_TOKEN: n8n-runners-auth-token-a3f8b2c1d4e5f6a7b8c9d0e1f2a3b4c5
      # --- IA désactivée ---
      # Décharge le module Assistant (instance-ai) par défaut.
      # instance-ai est chargé par défaut par n8n ; les agents (module
      # "agents") restent disponibles, seule l'Assistant est déchargée.
      N8N_DISABLED_MODULES: ${N8N_DISABLED_MODULES:-instance-ai}
      # --- Base de données : PostgreSQL ---
      # Défauts cohérents avec le service postgres (aucune var DB à déclarer) :
      DB_TYPE: ${DB_TYPE:-postgresdb}
      DB_POSTGRESDB_HOST: ${DB_POSTGRESDB_HOST:-postgres}
      DB_POSTGRESDB_PORT: ${DB_POSTGRESDB_PORT:-5432}
      DB_POSTGRESDB_DATABASE: ${DB_POSTGRESDB_DATABASE:-n8n}
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: a3f8b2c1d4e5f6a7b8c9d0e1f2a3b4c5
      DB_POSTGRESDB_SCHEMA: public
    # --- Traefik labels (Method 2 : config manuelle) ---
    # Préférer l'onglet Domains de l'UI Dokploy (Method 1) — les labels sont ajoutés automatiquement.
    # Décommenter ci-dessous si tu utilises la config manuelle :
    # labels:
    #   - traefik.enable=true
    #   - traefik.http.routers.n8n.rule=Host(`n8n.tondomaine.com`)
    #   - traefik.http.routers.n8n.entrypoints=websecure
    #   - traefik.http.routers.n8n.tls.certResolver=letsencrypt
    #   - traefik.http.services.n8n.loadbalancer.server.port=5678

volumes:
  db-storage:
  n8n-storage:

# --- Réseau ---
# Isolated Deployments (par défaut dans Dokploy) gère le réseau automatiquement.
# Si tu n'utilises PAS Isolated Deployments, décommente :
# networks:
#   dokploy-network:
#     external: true
