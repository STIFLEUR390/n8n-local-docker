# ============================================================================
# docker-compose.dokploy.yml
# Version Dokploy du stack n8n local.
# Différences avec docker-compose.yml :
#   - Pas de ports exposés (Dokploy/Traefik gère le routing)
#   - Pas de env_file: .env (Dokploy écrit .env depuis l'UI, les ${...} suffisent)
#   - searxng monté via ../files/ (recommandé par Dokploy au lieu de ./)
#   - restart: unless-stopped sur les services persistants
#   - Réseau dokploy-network (Isolated Deployments le gère automatiquement)
#   - Labels Traefik en commentaires (préférer l'onglet Domains de l'UI)
# ============================================================================

version: "3.8"

services:
  # --- Sandbox : certificats mTLS (runs once, then exits) ---
  sandbox-certs:
    image: ghcr.io/n8n-io/n8n-sandbox-service-api:latest
    user: '0:0'
    entrypoint: ['sh', '-c']
    command:
      - >
        bootstrap-mtls.sh --out-dir /tls --api-san sandbox-api
        --control-san-prefix sandbox-runner &&
        chown -R sandbox-api:sandbox-api /tls/api
    environment:
      NUM_RUNNERS: '1'
    volumes:
      - sandbox-tls:/tls

  # --- Sandbox : API de contrôle ---
  sandbox-api:
    image: ghcr.io/n8n-io/n8n-sandbox-service-api:latest
    depends_on:
      sandbox-certs:
        condition: service_completed_successfully
    environment:
      SANDBOX_API_KEYS: ${SANDBOX_API_KEYS}
      SANDBOX_API_RUNNER_REGISTRATION_TOKEN: ${SANDBOX_API_RUNNER_REGISTRATION_TOKEN}
      SANDBOX_API_RUNNER_API_KEY: ${SANDBOX_API_RUNNER_API_KEY}
      SANDBOX_API_GRPC_TLS_CERT_FILE: /tls/api/grpc-server.crt
      SANDBOX_API_GRPC_TLS_KEY_FILE: /tls/api/grpc-server.key
      SANDBOX_API_GRPC_TLS_CLIENT_CA_FILE: /tls/api/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CA_FILE: /tls/api/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/api/control-grpc-api-client.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/api/control-grpc-api-client.key
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_SERVER_NAME: sandbox-runner-1
    volumes:
      - sandbox-tls:/tls:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  # --- Sandbox : runner Docker-in-Docker ---
  sandbox-runner-1:
    image: ghcr.io/n8n-io/n8n-sandbox-service-runner-dind:latest
    privileged: true
    depends_on:
      sandbox-api:
        condition: service_healthy
    environment:
      SANDBOX_RUNNER_API_KEYS: ${SANDBOX_API_RUNNER_API_KEY}
      SANDBOX_RUNNER_REGISTRATION_TOKEN: ${SANDBOX_API_RUNNER_REGISTRATION_TOKEN}
      SANDBOX_RUNNER_API_GRPC_ADDR: sandbox-api:9090
      SANDBOX_RUNNER_HTTP_BASE_URL: http://sandbox-runner-1:8080
      SANDBOX_RUNNER_CONTROL_GRPC_LISTEN_ADDR: ':9091'
      SANDBOX_RUNNER_CONTROL_GRPC_ADVERTISE_ADDR: sandbox-runner-1:9091
      SANDBOX_RUNNER_ID: runner-1
      SANDBOX_RUNNER_DOCKER_SANDBOX_IMAGE: ghcr.io/n8n-io/n8n-sandbox-service-sandbox:latest
      SANDBOX_RUNNER_REGISTRATION_GRPC_CA_FILE: /tls/runner/ca.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_CERT_FILE: /tls/runner/grpc-client.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_KEY_FILE: /tls/runner/grpc-client.key
      SANDBOX_RUNNER_REGISTRATION_GRPC_SERVER_NAME: sandbox-api
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/runner/control-grpc-server.crt
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/runner/control-grpc-server.key
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CLIENT_CA_FILE: /tls/runner/ca.crt
    volumes:
      - sandbox-tls:/tls:ro

  # --- Web search local ---
  searxng:
    image: ghcr.io/searxng/searxng:latest
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET}
    volumes:
      # Dokploy : monter via ../files/ (le dossier ../files est persistant entre déploiements)
      # OU via File Mounts (Advanced → Mounts dans l'UI Dokploy)
      - ../files/searxng-settings.yml:/etc/searxng/settings.yml:ro

  # --- PostgreSQL 17 Alpine ---
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_POSTGRESDB_USER}
      POSTGRES_PASSWORD: ${DB_POSTGRESDB_PASSWORD}
      POSTGRES_DB: ${DB_POSTGRESDB_DATABASE}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - db-storage:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${DB_POSTGRESDB_USER} -d ${DB_POSTGRESDB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- n8n : workflow editor + AI Assistant ---
  n8n:
    image: n8nio/n8n
    restart: unless-stopped
    depends_on:
      sandbox-api:
        condition: service_healthy
      postgres:
        condition: service_healthy
    # Pas de ports: Dokploy/Traefik gère le routing via l'onglet Domains
    environment:
      # --- n8n AI Assistant ---
      N8N_ENABLED_MODULES: ${N8N_ENABLED_MODULES}
      N8N_INSTANCE_AI_MODEL: ${N8N_INSTANCE_AI_MODEL}
      N8N_INSTANCE_AI_MODEL_API_KEY: ${N8N_INSTANCE_AI_MODEL_API_KEY}
      N8N_INSTANCE_AI_SANDBOX_ENABLED: ${N8N_INSTANCE_AI_SANDBOX_ENABLED}
      N8N_INSTANCE_AI_SANDBOX_IMAGE: ${N8N_INSTANCE_AI_SANDBOX_IMAGE}
      N8N_SANDBOX_SERVICE_URL: ${N8N_SANDBOX_SERVICE_URL}
      N8N_SANDBOX_SERVICE_API_KEY: ${N8N_SANDBOX_SERVICE_API_KEY}
      # --- Base de données : PostgreSQL ---
      DB_TYPE: ${DB_TYPE}
      DB_POSTGRESDB_HOST: ${DB_POSTGRESDB_HOST}
      DB_POSTGRESDB_PORT: ${DB_POSTGRESDB_PORT}
      DB_POSTGRESDB_DATABASE: ${DB_POSTGRESDB_DATABASE}
      DB_POSTGRESDB_USER: ${DB_POSTGRESDB_USER}
      DB_POSTGRESDB_PASSWORD: ${DB_POSTGRESDB_PASSWORD}
      DB_POSTGRESDB_SCHEMA: ${DB_POSTGRESDB_SCHEMA}
    # --- Traefik labels (Method 2 : config manuelle) ---
    # Préférer l'onglet Domains de l'UI Dokploy (Method 1) — les labels sont ajoutés automatiquement.
    # Décommenter ci-dessous si tu utilises la config manuelle :
    # labels:
    #   - traefik.enable=true
    #   - traefik.http.routers.n8n.rule=Host(`n8n.tondomaine.com`)
    #   - traefik.http.routers.n8n.entrypoints=websecure
    #   - traefik.http.routers.n8n.tls.certResolver=letsencrypt
    #   - traefik.http.services.n8n.loadbalancer.server.port=5678

volumes:
  sandbox-tls:
  db-storage:

# --- Réseau ---
# Isolated Deployments (par défaut dans Dokploy) gère le réseau automatiquement.
# Si tu n'utilises PAS Isolated Deployments, décommente :
# networks:
#   dokploy-network:
#     external: true
